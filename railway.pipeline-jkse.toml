[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.pipeline"
watchPatterns = [
  "harvest/**",
  "pipeline/**",
  "data/jkse/syariah.csv",
  "requirements-pipeline.txt",
  "Dockerfile.pipeline",
]

[deploy]
# Prices, then the trading scans and track record (pipeline/trading_nightly.sh).
startCommand = "sh pipeline/trading_nightly.sh"
cronSchedule = "0 16 * * 1-5"
restartPolicyType = "NEVER"
