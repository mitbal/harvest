[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.pipeline"
watchPatterns = [
  "harvest/**",
  "pipeline/**",
  "requirements-pipeline.txt",
  "Dockerfile.pipeline",
]

[deploy]
startCommand = "timeout --signal=TERM --kill-after=60s 6h python -m pipeline.daily_data --exchange sp500"
cronSchedule = "0 4 * * 2-6"
restartPolicyType = "NEVER"
