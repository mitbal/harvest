[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.pipeline"
watchPatterns = [
  "harvest/**",
  "pipeline/**",
  "requirements-pipeline.txt",
  "Dockerfile.pipeline",
]

[deploy]
# Weekly setup search for every tool, Sunday 10:00 WIB (pipeline/trading_weekly.sh).
# Needs the same environment as the jkse pipeline. Railway stops a run after 6 hours.
startCommand = "sh pipeline/trading_weekly.sh"
cronSchedule = "0 3 * * 0"
restartPolicyType = "NEVER"
